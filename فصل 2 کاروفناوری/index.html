nset:13%;border:2px dashed #70ca9b70;border-radius:50%;animation:spin 42s linear infinite}.scene{position:relative;z-index:2;width:100%;max-width:510px;max-height:100%;overflow:visible;filter:drop-shadow(0 16px 15px #0c85500d);animation:float 5s ease-in-out infinite}.orbit{transform-origin:260px 250px;animation:spin 26s linear infinite}.scene .spark{animation:pulse 3s ease-in-out infinite}.number{position:absolute;top:25px;left:30px;font-size:80px;font-weight:900;color:#0c8e5e0b;z-index:1;line-height:1}.corner{position:absolute;bottom:22px;left:28px;font-size:11px;color:#8caf9a;font-weight:800;z-index:3}.footer{height:76px;flex-shrink:0;padding:0 clamp(18px,4vw,55px);display:flex;justify-content:space-between;align-items:center;gap:20px}.hint{font-size:12px;color:#4c8567;font-weight:700}.controls{display:flex;align-items:center;gap:13px}.btn{border:0;border-radius:15px;background:linear-gradient(135deg,#0da66e,#087f59);color:#fff;padding:11px 22px;min-width:112px;font-family:inherit;font-size:14px;font-weight:900;cursor:pointer;box-shadow:0 8px 18px #09885c30;transition:transform .2s,box-shadow .2s}.btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 12px 20px #09885c40}.btn:disabled{opacity:.35;cursor:default;box-shadow:none}.counter{font-weight:900;color:#0c7854;font-size:14px;min-width:60px;text-align:center}.mini{border:1px solid #c9e9d6;border-radius:12px;background:white;color:#0b865a;padding:10px 13px;font:inherit;cursor:pointer;font-weight:800}.slide.is-exiting .slide-inner{animation:leave .18s ease-in both}@keyframes reveal{from{opacity:0;transform:translateY(19px) scale(.985)}to{opacity:1;transform:none}}@keyframes leave{to{opacity:0;transform:translateY(-8px)}}@keyframes float{50%{transform:translateY(-10px)}}@keyframes morph{50%{border-radius:55% 45% 38% 62%;transform:rotate(10deg)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{opacity:.4}}@media(max-width:1050px){.slide-inner{grid-template-columns:minmax(0,1.2fr) minmax( 2px}.counter{min-width:42px;font-size:12px}}</style></head><body><div class="app"><header class="header"><div class="logo"><span class="logo-icon">✦</span><span>آرش ملایری</span></div><div class="progress" aria-label="پیشرفت ارائه"><div class="bar" id="bar"></div></div><span class="head-label">پودمان دوم • فناوری اطلاعات و ارتباطات</span></header><main class="main"><article class="slide" id="slide" aria-live="polite"></article></main><footer class="footer"><span class="hint">حرکت با کلیدهای ← → یا دکمه‌های پایین • F برای تمام‌صفحه</span><div class="controls"><button class="mini music-btn" id="musicToggle" type="button" aria-pressed="false" aria-label="پخش آهنگ پس‌زمینه"><span class="music-icon" id="musicIcon">♫</span><span id="musicLabel">آهنگ</span></button><button class="mini" id="full" title="تمام صفحه">⛶</button><button class="btn" id="prev">قبلی ←</button><span class="counter" id="count"></span><button class="btn" id="next">بعدی →</button></div></footer></div><audio id="transitionSfx" src="assets/muo.mp3" preload="auto"></audio><audio id="backgroundMusic" src="assets/ghgh.mp3" preload="none" loop></audio><script>const slides=[{"title": "فناوری اطلاعات و ارتباطات", "sub": "سفر به دنیای هوشمند", "desc": "در پودمان دوم کار و فناوری هفتم یاد می‌گیریم اطلاعات چگونه از یک پرسش ساده به دانشی کاربردی تبدیل می‌شوند و ابزارهای دیجیتال چگونه ارتباط ما را با دیگران آسان می‌کنند.", "bullets": ["آشنایی با مفهوم اطلاعات و فناوری اطلاعات و ارتباطات", "شناخت ابزارهای دیجیتال و کاربرد آن‌ها در زندگی", "تمرین جست‌وجوی درست، ذخیره‌سازی و امنیت اطلاعات"], "note": "پرسش آغازین: اگر برای یک تحقیق مدرسه اینترنت نداشته باشیم، از چه راه‌های دیگری می‌توانیم اطلاعات جمع‌آوری کنیم؟", "art": "intro"}, {"title": "فناوری اطلاعات و ارتباطات چیست؟", "sub": "ICT؛ فراتر از رایانه", "desc": "فناوری اطلاعات و ارتباطات یا ICT مجموعه‌ای از ابزارها و روش‌هایی است که به ما کمک می‌کند اطلاعات مورد نیاز را جمع‌آوری، پردازش، ذخیره، بازیابی و منتقل کنیم. بخش ارتباطات نیز امکان رساندن پیام و اطلاعات به دیگر
